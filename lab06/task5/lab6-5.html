<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <title>Завдання 5 — погодна картка</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="scene">
        <div class="card">
            <div class="arrows">
                <span class="arrow">&larr;</span><span class="arrow">&rarr;</span>
            </div>
            <div class="cloud"></div>
            <div class="temp">17</div>
            <div class="city">Чернівці</div>
        </div>

        <div class="forecast">
            <div class="day"><span class="day-name">Mon</span>17°</div>
            <div class="day"><span class="day-name">Tue</span>19°</div>
            <div class="day"><span class="day-name">Wed</span>16°</div>
            <div class="day"><span class="day-name">Thu</span>18°</div>
            <div class="day"><span class="day-name">Fri</span>21°</div>
        </div>
    </div>
</body>
</html>
