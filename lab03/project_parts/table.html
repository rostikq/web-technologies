<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <title>Завдання 1 - Таблиця</title>
</head>
<body style="text-align: center;">
    <div style="display: inline-block;">
        <table border="1" style="border: 2px solid black; border-collapse: collapse; margin: 0 auto;">
            <tr>
                <td colspan="5" style="background-color: #00fa9a; height: 30px;"></td>
            </tr>
            <tr>
                <td style="background-color: #fff8dc; width: 30px;"></td>
                <td colspan="3" style="background-color: #00fa9a; height: 30px;"></td>
                <td style="background-color: #fff8dc; width: 30px;"></td>
            </tr>
            <tr>
                <td style="background-color: #fff8dc; width: 30px;"></td>
                <td style="background-color: #fff8dc; width: 30px;"></td>
                <td>
                    <table border="1" style="border: 2px solid black; border-collapse: collapse;">
                        <tr>
                            <td colspan="2" style="background-color: #00fa9a; height: 30px;"></td>
                        </tr>
                        <tr>
                            <td style="background-color: red; width: 40px; height: 40px;"></td>
                            <td style="background-color: blue; width: 40px; height: 40px;"></td>
                        </tr>
                        <tr>
                            <td style="background-color: lime; width: 40px; height: 40px;"></td>
                            <td style="background-color: yellow; width: 40px; height: 40px;"></td>
                        </tr>
                        <tr>
                            <td colspan="2" style="background-color: #00fa9a; height: 30px;"></td>
                        </tr>
                    </table>
                </td>
                <td style="background-color: #fff8dc; width: 30px;"></td>
                <td style="background-color: #fff8dc; width: 30px;"></td>
            </tr>
            <tr>
                <td style="background-color: #fff8dc; width: 30px;"></td>
                <td colspan="3" style="background-color: #00fa9a; height: 30px;"></td>
                <td style="background-color: #fff8dc; width: 30px;"></td>
            </tr>
            <tr>
                <td colspan="5" style="background-color: #00fa9a; height: 30px;"></td>
            </tr>
        </table>
        <p><a href="../index.html">Повернутись на головну</a></p>
    </div>
</body>
</html>
