<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <title>Завдання 2 - Композиція Пiта Мондрiана</title>
</head>
<body style="text-align: center;">
    <div style="display: inline-block;">
        <table style="border-collapse: collapse; width: 400px; height: 400px; margin: 0 auto; background-color: #ffffff;">
            <tr style="height: 10px;">
                <td style="width: 30px; border-right: 8px solid #000000;"></td>
                <td style="border-right: 8px solid #000000;"></td>
                <td style="width: 150px; border-right: 8px solid #000000;"></td>
                <td style="width: 80px;"></td>
                <td style="width: 8px; background-color: #000000;"></td>
                <td style="background-color: #fffa69;" colspan="2"></td>
            </tr>
            <tr style="height: 8px; background-color: #000000;">
                <td colspan="7"></td>
            </tr>
            <tr>
                <td style="border-right: 8px solid #000000;" rowspan="2"></td>
                <td style="background-color: #ff5b2d;" colspan="3" rowspan="3"></td>
                <td style="background-color: #000000;"></td>
                <td style="background-color: #fffa69;" colspan="2" rowspan="2"></td>
            </tr>
            <tr style="height: 80px;">
                <td style="background-color: #000000;"></td>
            </tr>
            <tr style="height: 8px; background-color: #000000;">
                <td colspan="1"></td>
                <td colspan="3"></td>
            </tr>
            <tr style="height: 100px;">
                <td style="border-right: 8px solid #000000;"></td>
                <td style="background-color: #000000; width: 80px;" rowspan="2"></td>
                <td style="border-right: 8px solid #000000;"></td>
                <td colspan="2" style="border-right: 8px solid #000000;"></td>
                <td colspan="2"></td>
            </tr>
            <tr style="height: 8px; background-color: #000000;">
                <td style="background-color: #000000;"></td>
                <td colspan="5"></td>
            </tr>
            <tr style="height: 60px;">
                <td style="background-color: #fffa69; border-right: 8px solid #000000;"></td>
                <td style="background-color: #000000;"></td>
                <td style="border-top: 8px solid #000000; border-right: 8px solid #000000;"></td>
                <td style="background-color: #000000;" colspan="2"></td>
                <td style="background-color: #074481;" colspan="2"></td>
            </tr>
        </table>
        <p><a href="../index.html">Повернутись на головну</a></p>
    </div>
</body>
</html>
